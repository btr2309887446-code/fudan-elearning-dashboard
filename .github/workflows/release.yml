# 打 tag 时自动构建并发布 Release。
#
# 目的：让安装包有一个**固定的下载地址**，不用每次进 Actions 页面翻 Artifacts。
#
#   https://github.com/btr2309887446-code/fudan-elearning-dashboard/releases/latest
#
# 触发方式：
#   git tag v0.9.1 && git push origin v0.9.1
#
# 产出：
#   · Fudan-eLearning-Dashboard-<版本>-setup.exe   Windows 安装包（NSIS）
#   · app-unsigned.ipa                             iOS 未签名包（侧载用）
#   · fudan-elearning-macos.zip                    macOS 应用
#
# iOS 包是**未签名**的：没有付费开发者账号时签名证书只能维持 7 天，
# 所以这里直接产出未签名 IPA，由使用者用 Sideloadly / SideStore / AltStore
# 自己签。仓库不保存任何证书。

name: Release

on:
  push:
    tags:
      - 'v*'
  # 也允许手动重跑（比如某次构建失败后补发）
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到的 tag（例如 v0.9.1）'
        required: true
      platform:
        type: choice
        options: [all, windows, ios, macos]
        default: all

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: target
        env:
          TARGET_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TARGET_TAG"
          SHA=$(git rev-parse --verify "refs/tags/$TARGET_TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  validated:
    needs: resolve
    uses: ./.github/workflows/validation.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      platform: ${{ inputs.platform || 'all' }}
  # ------------------------------------------------------------ macOS
  macos:
    needs: resolve
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'macos' }}
    name: macOS 应用
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 依赖
        working-directory: flutter_app
        run: flutter pub get

      - name: Flutter regression tests
        working-directory: flutter_app
        run: flutter test

      # 没有开发者证书时用 ad-hoc 签名（CODE_SIGN_IDENTITY=-）。
      # 首次打开需要右键 → 打开，或执行 xattr -cr /Applications/fudan_elearning.app
      # 绕过 Gatekeeper（因为未做公证 notarization）。
      - name: 构建
        working-directory: flutter_app
        env:
          CODE_SIGN_IDENTITY: '-'
        run: flutter build macos --release

      - name: 打包
        working-directory: flutter_app
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/fudan_elearning.app"
          test -d "$APP"
          rm -f fudan-elearning-macos.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" fudan-elearning-macos.zip
          ls -lh fudan-elearning-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: flutter_app/fudan-elearning-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------- Release
  publish:
    name: 发布 Release
    needs: [resolve, validated, macos]
    if: ${{ always() && needs.resolve.result == 'success' && needs.validated.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -name '*.ipa' -exec cp {} out/ \;
          find artifacts -name '*.exe' -exec cp {} out/ \;
          find artifacts -name 'fudan-elearning-macos.zip' -exec cp {} out/ \;
          find artifacts -name '*-manifest.json' -exec cp {} out/ \;
          find artifacts -name '*-SHA256SUMS.txt' -exec cp {} out/ \;
          echo '--- 将发布的文件 ---'
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          # push tag 时用 tag 名；手动触发时用输入的那个
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | **Windows** | `Fudan-eLearning-Dashboard-*-setup.exe` | 双击安装，会在桌面和开始菜单创建快捷方式 |
            | **iOS** | `app-unsigned.ipa` | **未签名**，需用 Sideloadly / SideStore / AltStore 自行签名后安装 |
            | **macOS** | `fudan-elearning-macos.zip` | 解压后把 `.app` 拖进「应用程序」；首次打开需右键 →「打开」 |

            ## 登录

            用复旦 UIS 学号和密码登录。密码默认不落盘，也不会发往除复旦认证服务器
            与 eLearning 之外的任何地址。

            ## 说明

            - iOS 包**没有签名**：免费开发者账号的证书只能维持 7 天，所以这里直接
              产出未签名包，由使用者自己签。仓库不保存任何证书。
            - macOS 包是 ad-hoc 签名、未做公证，首次打开可能被 Gatekeeper 拦下。
            - 这些包都是 CI 自动构建的，构建日志见本次运行的 Actions 页面。
