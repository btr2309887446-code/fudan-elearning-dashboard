org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Android 的 Gradle 插件会拒绝在含非 ASCII 字符的路径下构建（本项目路径里有「杂」）。
# 这是 Windows 上的历史遗留限制：http://b.android.com/95744
#
# 注意：这个开关只关掉「检查」，并没有解决底层问题。
# 实测结论（Flutter 3.47 / AGP 9）：
#   - debug 构建（JIT，不做 AOT）在这种路径下可以成功 → 需要这个开关；
#   - release/profile 构建会在 Dart AOT 阶段失败，因为原生工具 gen_snapshot
#     拿到的是被错误解码的路径（「杂」变成「锟斤拷」），读不到 app.dill。
#
# 所以：**release 包必须在纯 ASCII 路径下构建**，例如 D:\build\fudan_elearning。
android.overridePathCheck=true
