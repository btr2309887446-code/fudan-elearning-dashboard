https://elearning-assets.fudan.edu.cn/photos/ykt/371/45/1d159c9e806da6cf7e70edbb0746a566.jpg","html_url":"https://elearning.fudan.edu.cn/courses/5092/users/60266","pronouns":null},"published":true,"hide_from_students":false,"front_page":true,"html_url":"https://elearning.fudan.edu.cn/courses/5092/pages/huan-ying","todo_date":null,"publish_at":null,"updated_at":"2026-04-22T17:33:13+08:00","locked_for_user":false,"body":"\u003ch2\u003e使用帮助\u003c/h2\u003e\n\u003cp\u003eeLearning常见问题的处理方法可以参考\u003cspan style=\"color: #ff0000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 24pt;\"\u003e\u003ca id=\"\" class=\"\" style=\"color: #ff0000;\" title=\"常见问题解答\" href=\"https://elearning.fudan.edu.cn/courses/5092/pages/chang-jian-wen-ti-jie-da\" target=\"\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/pages/chang-jian-wen-ti-jie-da\" data-api-returntype=\"Page\"\u003e常见问题解答\u003c/a\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e。\u003c/p\u003e\n\u003ch3\u003e\u003ca id=\"\" class=\"\" title=\"帮助文档\" href=\"https://elearning.fudan.edu.cn/courses/5092/pages/bang-zhu-wen-dang\" target=\"\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/pages/bang-zhu-wen-dang\" data-api-returntype=\"Page\"\u003e\u003cspan style=\"color: #ff0000;\"\u003e\u003cstrong\u003e帮助文档\u003c/strong\u003e\u003c/span\u003e\u003c/a\u003e中提供了部分使用文档以及一些介绍材料。\u003c/h3\u003e\n\u003cp\u003e如果在使用过程中遇到问题，还可以将您的问题通过电子邮件的方式，联系eLearning系统维护邮箱( elearning@fudan.edu.cn )。\u003c/p\u003e\n\u003cp\u003e您也可以通过信息办智能问答机器人快速获得常见问题的解答，请戳 ---\u0026gt;\u0026nbsp;\u003ca href=\"https://aiagent.fudan.edu.cn/page/?app=210\" target=\"_blank\"\u003e\u003cimg src=\"https://elearning.fudan.edu.cn/courses/5092/files/1840695/preview?verifier=EFXGIqdOOL7Lia06nluZLmXf1q5eVwU6s0BRSSI2\" alt=\"复小信x100.png\" width=\"100\" height=\"68\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/files/1840695\" data-api-returntype=\"File\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e近日，eLearning 开始试运行 \u003cstrong\u003e代码实验室\u003c/strong\u003e 功能。\u003c/p\u003e\n\u003cp\u003e\u003cbr\u003eeLearning代码实验室是一个对全校师生开放的在线编程平台。平台提供完整的Python和R语言编辑运行环境，师生无需任何环境搭建，只需网络连接即可进行代码的编写和运行。平台同时提供GPU运算资源供师生进行AI模型训练。以下是使用eLearning代码实验室进行代码编辑运行的说明，以及使用GPU进行计算以及模型训练的方法。\u003c/p\u003e\n\u003cp\u003e\u003cbr\u003e对此功能感兴趣的老师，可以联系 elearning@fudan.edu.cn 进行试用。\u003c/p\u003e\n\u003cp\u003e具体的功能介绍和使用方法可参考\u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"链接\" href=\"https://elearning.fudan.edu.cn/courses/5092/files/5515068?verifier=ai9xf7lhwNpCMao046rCv3pnS2KO9Xu0k3iV6bKz\u0026amp;wrap=1\" target=\"_blank\" data-canvas-previewable=\"true\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/files/5515068\" data-api-returntype=\"File\"\u003e《eLearning代码实验室操作手册》\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3\u003e\u003cspan style=\"font-size: 14pt;\"\u003e\u003cspan style=\"font-size: 24pt;\"\u003e请不要在eLearning的“文件”工具中直接存放课程视频。对于此类视频，学生需要下载到本地之后才能播放，不支持在线播放。\u003c/span\u003e\u003c/span\u003e\u003c/h3\u003e\n\u003ch3\u003e\u003cspan style=\"font-size: 14pt;\"\u003e视频类可见可以通过以下几种方式管理，\u003c/span\u003e\u003cspan style=\"font-size: 14pt;\"\u003e供参考：\u003c/span\u003e\u003c/h3\u003e\n\u003ch4\u003e\u003cstrong\u003e1. eLearning 视频工具:\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e\u003ca title=\"视频 | 简介\" href=\"https://elearning.fudan.edu.cn/courses/5092/pages/shi-pin-%7C-jian-jie\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/pages/shi-pin-%257C-jian-jie\" data-api-returntype=\"Page\"\u003eeLearning视频工具简介\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca title=\"视频 | 启用视频功能\" href=\"https://elearning.fudan.edu.cn/courses/5092/pages/shi-pin-%7C-qi-yong-shi-pin-gong-neng\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/pages/shi-pin-%257C-qi-yong-shi-pin-gong-neng\" data-api-returntype=\"Page\"\u003e启用eLearning视频功能\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca title=\"视频 | 启用视频功能\" href=\"https://elearning.fudan.edu.cn/courses/5092/pages/shi-pin-%7C-qi-yong-shi-pin-gong-neng\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/pages/shi-pin-%257C-qi-yong-shi-pin-gong-neng\" data-api-returntype=\"Page\"\u003e\u003c/a\u003e\u003ca title=\"视频 | 视频上传\" href=\"https://elearning.fudan.edu.cn/courses/5092/pages/shi-pin-%7C-shi-pin-shang-chuan\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/pages/shi-pin-%257C-shi-pin-shang-chuan\" data-api-returntype=\"Page\"\u003e上传视频到eLearning视频工具\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca title=\"视频 | 添加视频到单元工具\" href=\"https://elearning.fudan.edu.cn/courses/5092/pages/shi-pin-%7C-tian-jia-shi-pin-dao-dan-yuan-gong-ju\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/pages/shi-pin-%257C-tian-jia-shi-pin-dao-dan-yuan-gong-ju\" data-api-returntype=\"Page\"\u003e添加视频到单元工具\u003c/a\u003e\u003c/p\u003e\n\u003ch4\u003e\u003cstrong\u003e2. 钉钉：\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e\u003ca class=\"instructure_file_link\" title=\"钉钉课件上传和下载手册-精简版（钉钉5.0版本）.pptx\" href=\"https://elearning.fudan.edu.cn/courses/5092/files/266695/download?verifier=PMOObxdQBzmPUvZsjq70W7265sZzwuRama8gsiBp\u0026amp;wrap=1\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/files/266695\" data-api-returntype=\"File\"\u003e钉钉课件上传和下载手册-精简版（钉钉5.0版本）\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca class=\"instructure_file_link\" title=\"钉钉课件上传和下载手册（精简版）_16.pdf\" href=\"https://elearning.fudan.edu.cn/courses/5092/files/234431/download?verifier=JUf7y4x9yUyNVdiix7yn15iCATeAkQLDAp1m69LU\u0026amp;wrap=1\" data-api-endpoint=\"https://elearning.fudan.edu.cn/api/v1/courses/5092/files/234431\" data-api-returntype=\"File\"\u003e\u003c/a\u003e\u003ca class=\"instructure_file_link\" title=\"钉钉课件上传和下载手册：（以复旦电子信息2019级为例）.pdf\" href=\"https://elearning.fudan.edu.cn/courses/5092/files/234432/download?veri
